# herdr-plugin.toml — manifest for the herdr PDF Viewer plugin.
#
# Renders a PDF page as pixels and paints it into a herdr split pane as
# Kitty graphics protocol escapes (chunked base64 PNG) written to the pane's
# own output — herdr 0.9.2 removed the pane.graphics.* socket API. A
# KGP-capable terminal is required on the herdr client side. PNG rather than
# raw RGBA because herdr never compresses anything itself, so a ~3.7 MB RGBA
# frame would reach the terminal as ~4.9 MB of base64 escape text per
# keypress against ~0.44 MB for the same page as PNG; see README for the
# full path.
# j/k (and arrows) page through the document.
#
# id charset is validated by herdr's normalize_identifier(): ASCII
# alphanumeric plus `:` `.` `_` `-`, <=120 chars (manifest.rs). "pdf" is
# valid. Action ids additionally forbid `.` (normalize_local_identifier),
# so the single action id below ("open") avoids dots too.

id = "pdf"
name = "PDF Viewer"
version = "0.3.2"
description = "View PDF files as rendered pages in a herdr split pane."
min_herdr_version = "0.9.2"
platforms = ["macos", "linux"]

# Installs bin/herdr-pdf: downloads a version-matched, SHA-256-verified
# prebuilt binary when one is available, otherwise builds from source with
# Go. Idempotent; runs once at link/install time and again on update.
[[build]]
command = ["./build.sh"]

# The viewer pane itself. Opened on demand by the "open" action (or
# directly via `herdr plugin pane open --plugin pdf --entrypoint view`),
# never automatically — there is no [[events]] hook.
[[panes]]
id = "view"
title = "PDF Viewer"
placement = "split"
command = ["./bin/herdr-pdf", "view"]

# Entry point for both link-click handling and manual invocation
# (`herdr plugin action invoke open --plugin pdf`).
[[actions]]
id = "open"
title = "Open PDF"
description = "Open a PDF file in a new split pane."
# With nothing to resolve (a keybinding pressed with no selection) the same
# pane opens in browser mode on the focused pane's directory instead of
# failing; a genuine error — a non-PDF, a remote file:// host, a missing
# file — still reports itself.
command = ["./bin/herdr-pdf", "open"]

# Ctrl+click (or OSC 8 file:// activation) on a path ending in .pdf routes
# here instead of trying to open a browser. Rust regex, TOML-escaped: `\\.`
# matches a literal dot, `(?i)` makes the whole match case-insensitive so
# `.PDF` also hits. Matches both bare paths and file:// URLs.
[[link_handlers]]
id = "pdf"
title = "Open PDF"
pattern = "(?i)^(file://)?.*\\.pdf$"
action = "open"
